name: Refresh Astro dependencies

on:
  push:
    branches: [feat/migrate-portfolio-to-astro]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/migrate-portfolio-to-astro
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Resolve npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit npm lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(astro): refresh lockfile without Tailwind"
            git push origin HEAD:feat/migrate-portfolio-to-astro
          fi
