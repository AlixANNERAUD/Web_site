name: Portfolio CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Astro)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify AI instruction symlinks
        run: |
          test -s AGENTS.md
          for alias in CLAUDE.md GEMINI.md; do
            test -L "$alias"
            test "$(readlink "$alias")" = "AGENTS.md"
            cmp -s AGENTS.md "$alias"
          done
          test -L .github/copilot-instructions.md
          test "$(readlink .github/copilot-instructions.md)" = "../AGENTS.md"
          cmp -s AGENTS.md .github/copilot-instructions.md
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format, type-check, validate, build and verify
        run: npm run check
